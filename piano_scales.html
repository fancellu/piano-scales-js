<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Scale Finder</title>
  <link rel="stylesheet" href="style.css">
  <!-- three.js r187 (ES modules) for 3D mode; only fetched when 3D is first enabled -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
</head>
<body> <!-- Body will get the dark-mode class -->
<div class="app-container">
  <!-- Top-right toggles: 2D/3D view and light/dark theme -->
  <div class="top-toggles">
    <button id="view-toggle" title="Switch to 3D keyboard">3D</button>
    <button id="theme-toggle" title="Toggle Light/Dark Mode">☀️</button>
  </div>
  <!-- End Toggles -->

  <h1>Piano Scale Finder</h1>

  <div class="main-layout">
    <div class="left-col">
      <div id="piano-keyboard">
        <!-- Piano keys will be generated here by JavaScript -->
      </div>

      <!-- 3D keyboard (three.js, loaded on demand) -->
      <div id="piano-3d" hidden></div>
      <p id="piano-3d-hint" hidden>Drag to orbit · scroll to zoom · click keys to select</p>

      <!-- Selected notes + enharmonic preference on one row -->
      <div class="notes-row">
        <div class="selected-notes-display">
          <label for="selected-notes-field">Selected:</label>
          <input type="text" id="selected-notes-field" readonly title="Selected notes (sorted chromatically)">
        </div>
        <div class="enharmonic-toggle">
          <label>Display As:</label>
          <label><input type="radio" name="enharmonic" value="sharp" checked> Sharps (#)</label>
          <label><input type="radio" name="enharmonic" value="flat"> Flats (b)</label>
        </div>
      </div>

      <div class="playback-controls">
        <h2>Playback</h2>
        <button id="play-chord" title="Play selected notes simultaneously (C)" aria-keyshortcuts="c">Play <u>C</u>hord</button>
        <button id="play-arp-up" title="Play selected notes as an ascending arpeggio (U)" aria-keyshortcuts="u">Play Arp <u>U</u>p</button>
        <button id="play-arp-down" title="Play selected notes as a descending arpeggio (D)" aria-keyshortcuts="d">Play Arp <u>D</u>own</button>
        <label class="from-root" title="Start arpeggios on the chosen scale's root and finish on the root an octave up">
          <input type="checkbox" id="arp-from-root" checked> From root
        </label>
        <label class="speed" title="Milliseconds per arpeggio note">
          <input type="number" id="playback-speed" value="200" min="50" max="1000" step="50"> ms
        </label>
        <div class="sound-row">
          <label for="instrument">Sound:</label>
          <select id="instrument" title="Instrument used for playback, key clicks and MIDI"></select>
          <label class="from-root" title="Add room reverb"><input type="checkbox" id="reverb" checked> Reverb</label>
        </div>
      </div>

      <div class="playback-controls midi-controls">
        <h2>MIDI Input</h2>
        <button id="midi-connect" title="Listen to a connected MIDI keyboard">Connect MIDI</button>
        <label class="from-root" title="Play MIDI notes at their real pitch while held (otherwise a short click sound)"><input type="checkbox" id="midi-sound" checked> MIDI sound</label>
        <span id="midi-status" class="midi-status">Not connected</span>
      </div>
    </div>

    <div class="right-col">
      <div class="controls">
        <input type="text" id="scale-filter" placeholder="Filter scales by name...">
        <button id="sort-asc">Sort A-Z</button>
        <button id="sort-desc">Sort Z-A</button>
        <button id="clear-selection">Clear Selection</button>
      </div>

      <div id="scale-list-container">
        <h2 id="scale-list-title">Available Scales</h2>
        <ul id="scale-list">
          <!-- Scale list will be generated here -->
        </ul>
      </div>
    </div>
  </div>
</div>

<script src="synth.js"></script>
<script src="piano3d.js"></script>
<script src="script.js"></script>
</body>
</html>
